function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
async function dec(pass){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.ct)));
}
(function(){
  var g=document.getElementById('gate'),i=document.getElementById('p'),b=document.getElementById('b'),e=document.getElementById('e');

    try{ html=await dec(pass); }catch(err){ b.disabled=false; e.textContent=silent?'':'Невірний пароль'; return false; }

    g.style.display='none';
    document.open(); document.write(html); document.close();

  i.addEventListener('keydown',function(ev){ if(ev.key==='Enter') go(i.value.trim(),false); });
  var s=null; try{ s=sessionStorage.getItem('olha-handoff-pass'); }catch(err){}
  if(s) go(s,true).then(function(ok){ if(!ok) i.focus(); }); else setTimeout(function(){ i.focus(); },120);
})();
