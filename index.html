<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Треки міні Олі · 20.08 – 26.08 · RetroStyle Games HR</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="https://images.retrostylegames.com/wp-content/uploads/2023/05/new-retrostylegames-favicon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#181818; --bg-alt:#161616; --surface:#1D1D1D; --surface-2:#232323; --surface-3:#282828;
  --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.15);
  --text:#F2F2F2; --text-2:#D6D6D6; --muted:#9D9C9D; --faint:#767676;
  --accent:#92152E; --accent-deep:#5C0D1D; --red:#FE2D2D; --pink:#FF869E;
  --gold:#D4AF37; --success:#04B745; --mint:#5be08c; --sky:#6FB6FF;
  --font:"Montserrat",system-ui,-apple-system,sans-serif;
  --radius:18px;
  --shadow:0 18px 44px rgba(0,0,0,.45);
  --shadow-sm:0 6px 18px rgba(0,0,0,.3);
  --hero:radial-gradient(ellipse 130% 110% at 0% 0%,rgba(92,13,29,.6) 0%,rgba(24,24,24,.35) 78%);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--pink);text-decoration:none}
a:hover{text-decoration:underline}
b,strong{font-weight:700}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
::selection{background:rgba(146,21,46,.6)}

/* ================= HERO ================= */
.hero{position:relative;background:var(--hero);border-bottom:1px solid var(--border);overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0%,rgba(255,134,158,.07),transparent 48%);pointer-events:none}
.hero-inner{position:relative;padding:40px 0 34px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:11.5px;color:var(--gold);text-transform:uppercase;margin-bottom:24px}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(146,21,46,.22)}
h1{font-size:clamp(29px,5vw,52px);line-height:1.04;font-weight:800;margin:0 0 14px;letter-spacing:-.015em;text-wrap:balance}
h1 .hl{color:var(--pink)}
.lede{font-size:clamp(15px,1.8vw,17.5px);color:var(--text-2);max-width:760px;margin:0 0 24px;text-wrap:pretty}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);padding:9px 15px;border-radius:999px;font-size:13.5px;color:var(--text-2);font-weight:500}
.chip b{color:var(--text);font-weight:700}
.chip.hot{border-color:rgba(255,134,158,.4);background:rgba(146,21,46,.16)}
.chip.gold{border-color:rgba(212,175,55,.35)}

.progress-card{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 20px;box-shadow:var(--shadow-sm)}
.progress-num{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums}
.progress-num b{color:var(--pink)}
.progress-bar{flex:1;min-width:170px;height:9px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--red));border-radius:999px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.sync-note{font-size:12px;color:var(--muted);margin-top:11px;display:flex;align-items:center;gap:7px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.sync-dot.ok{background:var(--success)}
.sync-dot.local{background:var(--gold)}

/* ================= TIMELINE ================= */
.tl{display:flex;gap:10px;margin:26px 0 0;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tl-item{flex:1 0 150px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px 15px;position:relative}
.tl-item .d{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:5px}
.tl-item .t{font-size:13.5px;font-weight:600;color:var(--text);line-height:1.35}
.tl-item .s{font-size:12px;color:var(--muted);margin-top:4px}
.tl-item.now{border-color:rgba(255,134,158,.45);background:linear-gradient(180deg,rgba(146,21,46,.22),var(--surface))}
.tl-item.now .d{color:var(--pink)}
.tl-item.off{background:var(--bg-alt)}
.tl-item.off .d{color:var(--sky)}

/* ================= NAV ================= */
.navbar{position:sticky;top:0;z-index:60;background:rgba(24,24,24,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);margin-bottom:22px}
.navbar-inner{display:flex;align-items:center;gap:10px;padding:11px 0;overflow-x:auto;scrollbar-width:none}
.navbar-inner::-webkit-scrollbar{display:none}
.navbar a{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap;transition:.18s}
.navbar a:hover{border-color:var(--accent);color:var(--text);text-decoration:none}
.navbar a.active{border-color:var(--pink);color:var(--text);background:rgba(146,21,46,.25)}
.navbar .mini-done{color:var(--faint);font-weight:600;font-variant-numeric:tabular-nums}
.nav-tools{margin-left:auto;display:flex;gap:8px;flex:0 0 auto}
.tbtn{background:transparent;border:1px solid var(--border-2);color:var(--muted);border-radius:999px;padding:8px 14px;font-family:var(--font);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.18s}
.tbtn:hover{color:var(--text);border-color:var(--accent)}
.tbtn.on{color:var(--text);border-color:var(--pink);background:rgba(146,21,46,.25)}

/* ================= HOWTO / DEADLINES ================= */
.howto{background:rgba(146,21,46,.10);border:1px solid rgba(146,21,46,.35);border-radius:14px;padding:16px 20px;font-size:14px;color:var(--text-2)}
.howto b{color:var(--text)}
.howto ul{margin:8px 0 0;padding-left:20px}
.howto li{margin:4px 0}

.dl-box{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--red);border-radius:14px;padding:16px 20px;margin-top:14px}
.dl-title{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
.dl-list{display:flex;flex-direction:column;gap:8px}
.dl-row{display:flex;gap:12px;align-items:baseline;font-size:14px;color:var(--text-2)}
.dl-when{flex:0 0 96px;font-weight:800;color:var(--red);font-size:12.5px;letter-spacing:.02em}
.dl-when.soft{color:var(--gold)}
.dl-row b{color:var(--text)}

/* ================= GROUP LABEL ================= */
.group{display:flex;align-items:center;gap:14px;margin:36px 0 4px}
.group .n{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--accent);background:rgba(146,21,46,.18);border:1px solid rgba(146,21,46,.4);padding:5px 11px;border-radius:8px}
.group .t{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2)}
.group .line{flex:1;height:1px;background:var(--border)}

/* ================= CATEGORY ================= */
.cat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin:14px 0;overflow:hidden;box-shadow:var(--shadow);transition:border-color .2s}
.cat.open{border-color:var(--border-2)}
.cat-head{display:flex;align-items:center;gap:15px;padding:20px 22px;cursor:pointer;user-select:none;transition:background .18s}
.cat-head:hover{background:var(--surface-2)}
.cat-ico{font-size:25px;line-height:1;flex:0 0 auto}
.cat-titles{flex:1;min-width:0}
.cat-name{font-size:18.5px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cat-sub{font-size:13px;color:var(--muted);margin-top:3px}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:6px}
.status.hot{background:rgba(254,45,45,.14);color:#ff9d9d;border:1px solid rgba(254,45,45,.4)}
.status.watch{background:rgba(212,175,55,.13);color:#e9d79a;border:1px solid rgba(212,175,55,.35)}
.status.calm{background:rgba(4,183,69,.12);color:var(--mint);border:1px solid rgba(4,183,69,.32)}
.status.info{background:rgba(111,182,255,.12);color:var(--sky);border:1px solid rgba(111,182,255,.32)}
.owner-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,134,158,.12);border:1px solid rgba(255,134,158,.3);color:var(--pink);font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;white-space:nowrap}
.cat-prog{font-size:12.5px;color:var(--faint);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{transition:transform .3s cubic-bezier(.2,.8,.2,1);color:var(--muted);font-size:13px;flex:0 0 auto}
.cat.open .chev{transform:rotate(90deg)}
.cat-body{display:none;padding:2px 22px 24px}
.cat.open .cat-body{display:block;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

.ctx{font-size:14.5px;color:var(--text-2);background:var(--bg-alt);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:11px;padding:14px 16px;margin:6px 0 16px;text-wrap:pretty}
.ctx b{color:var(--text)}
.ctx p{margin:0 0 9px}
.ctx p:last-child{margin:0}

.block-label{font-size:11.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin:22px 0 10px;display:flex;align-items:center;gap:9px}
.block-label::after{content:"";flex:1;height:1px;background:var(--border)}

/* links */
.links{display:flex;flex-wrap:wrap;gap:9px}
.link-btn{display:inline-flex;align-items:center;gap:8px;background:var(--bg-alt);border:1px solid var(--border-2);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;color:var(--text-2);max-width:100%;transition:.18s}
.link-btn:hover{border-color:var(--accent);color:var(--text);text-decoration:none;transform:translateY(-1px)}
.link-btn .ic{color:var(--pink)}
.link-btn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* pipeline */
.pipe{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.pipe .step{background:var(--bg-alt);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:12.5px;color:var(--text-2);font-weight:600}
.pipe .step.now{border-color:rgba(255,134,158,.5);color:var(--pink);background:rgba(146,21,46,.18)}
.pipe .arr{color:var(--faint);font-size:11px}

/* tasks */
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:flex-start;gap:13px;background:var(--bg-alt);border:1px solid var(--border);border-radius:12px;padding:13px 15px;transition:border-color .2s,opacity .2s}
.task:hover{border-color:var(--border-2)}
.task.done{opacity:.55}
.task .chk{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:22px;height:22px;margin-top:1px;border:2px solid var(--border-2);border-radius:7px;cursor:pointer;position:relative;background:transparent;transition:.15s}
.task .chk:hover{border-color:var(--accent)}
.task .chk:checked{background:var(--accent);border-color:var(--accent)}
.task .chk:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.task-main{flex:1;min-width:0}
.task-title{font-size:14.5px;font-weight:600;color:var(--text);text-wrap:pretty}
.task.done .task-title{text-decoration:line-through;color:var(--muted)}
.task-sub{font-size:12.8px;color:var(--muted);margin-top:4px;text-wrap:pretty}
.task-sub a{color:var(--pink)}
.task.flag{border-color:rgba(254,45,45,.4);background:rgba(254,45,45,.06)}
.task .deadline{display:inline-block;font-size:11px;font-weight:800;color:var(--red);background:rgba(254,45,45,.12);padding:2px 8px;border-radius:6px;margin-top:7px}
.task-controls{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;align-items:flex-end}
.owner,.date{font-family:var(--font);font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--border-2);color:var(--text-2);border-radius:8px;padding:6px 9px;cursor:pointer}
.owner{min-width:118px}
.owner:focus,.date:focus{outline:none;border-color:var(--accent)}
.date{color-scheme:dark;min-width:118px}
body.only-open .task.done{display:none}

/* callouts */
.callout{border-radius:12px;padding:13px 16px;font-size:13.8px;margin-top:12px;text-wrap:pretty}
.callout.warn{background:rgba(212,175,55,.10);border:1px solid rgba(212,175,55,.35);color:#e9d79a}
.callout.info{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text-2)}
.callout.hot{background:rgba(254,45,45,.09);border:1px solid rgba(254,45,45,.35);color:#ffb4b4}
.callout.good{background:rgba(4,183,69,.08);border:1px solid rgba(4,183,69,.3);color:#a9e8c0}
.callout b{color:var(--text)}
.callout a{color:inherit;text-decoration:underline}

/* fact rows */
.facts{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.fact{display:flex;gap:14px;background:var(--bg-alt);padding:11px 15px;font-size:13.8px}
.fact .k{flex:0 0 150px;color:var(--muted);font-weight:600}
.fact .v{flex:1;color:var(--text-2);min-width:0;text-wrap:pretty}
.fact .v b{color:var(--text)}

/* contacts */
.contacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:12px}
.contact{background:var(--bg-alt);border:1px solid var(--border);border-radius:13px;padding:15px 16px}
.contact .nm{font-size:15px;font-weight:700;color:var(--text)}
.contact .rl{font-size:12.5px;color:var(--muted);margin-top:2px;margin-bottom:10px}
.contact .ch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;background:var(--surface);border:1px solid var(--border-2);border-radius:8px;padding:6px 10px;margin-bottom:9px}
.contact .ch.tg{color:var(--sky);border-color:rgba(111,182,255,.35)}
.contact .ch.wa{color:var(--mint);border-color:rgba(4,183,69,.3)}
.contact .phone{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.contact .phone span{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;color:var(--gold);letter-spacing:.02em}
.contact .about{font-size:12.8px;color:var(--text-2);line-height:1.5;text-wrap:pretty}
.copy-inline{background:transparent;border:1px solid var(--border-2);color:var(--muted);border-radius:6px;padding:3px 9px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font);transition:.15s}
.copy-inline:hover{color:var(--text);border-color:var(--accent)}
.copy-inline.ok{color:var(--mint);border-color:rgba(4,183,69,.4)}

/* drafts / editable */
.draft{background:var(--bg-alt);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:10px}
.draft-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.draft-label{font-size:13.5px;font-weight:700;color:var(--text)}
.copy-btn{background:var(--accent);border:none;color:#fff;font-family:var(--font);font-size:12px;font-weight:700;padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.15s}
.copy-btn:hover{background:var(--red)}
.copy-btn.copied{background:var(--success)}
.draft-text{width:100%;min-height:92px;resize:vertical;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:13.5px;line-height:1.55;border-radius:9px;padding:11px 13px}
.draft-text:focus{outline:none;border-color:var(--accent)}
.draft-text::placeholder{color:#6b6b6b;font-style:italic}

/* raw note */
details.raw{background:var(--bg-alt);border:1px solid var(--border);border-radius:12px;margin-top:12px;overflow:hidden}
details.raw>summary{cursor:pointer;list-style:none;padding:13px 16px;font-size:13.5px;font-weight:700;color:var(--text-2);display:flex;align-items:center;gap:9px}
details.raw>summary::-webkit-details-marker{display:none}
details.raw>summary::before{content:"▶";font-size:10px;color:var(--muted);transition:transform .25s}
details.raw[open]>summary::before{transform:rotate(90deg)}
details.raw>summary:hover{background:var(--surface-2)}
.raw-body{padding:2px 16px 16px;font-size:13.3px;color:var(--text-2);line-height:1.6;white-space:pre-wrap;border-top:1px solid var(--border);padding-top:14px;text-wrap:pretty}
.raw-body b{color:var(--text)}

/* footer */
footer{border-top:1px solid var(--border);margin-top:44px;padding:30px 0 60px;color:var(--muted);font-size:13px}
footer .big{color:var(--text-2);font-size:14.5px;margin-bottom:8px}
.tag{display:inline-block;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;color:var(--text-2);margin:0 2px}

/* gate */
#gate{position:fixed;inset:0;z-index:9999;background:var(--bg);background-image:var(--hero);display:flex;align-items:center;justify-content:center;padding:20px}
#gate .box{width:100%;max-width:380px;text-align:center}
#gate .glogo{font-weight:700;letter-spacing:.14em;font-size:12px;color:var(--gold);text-transform:uppercase;margin-bottom:22px}
#gate h2{font-size:24px;font-weight:800;margin:0 0 6px}
#gate p{color:var(--muted);font-size:14px;margin:0 0 22px}
#gate input{width:100%;background:var(--surface);border:1px solid var(--border-2);color:var(--text);font-family:var(--font);font-size:16px;border-radius:12px;padding:14px 16px;text-align:center;margin-bottom:12px}
#gate input:focus{outline:none;border-color:var(--accent)}
#gate button{width:100%;background:var(--accent);border:none;color:#fff;font-family:var(--font);font-size:15px;font-weight:700;border-radius:12px;padding:14px;cursor:pointer}
#gate button:hover{background:var(--red)}
#gate .err{color:var(--red);font-size:13px;height:18px;margin-top:10px;font-weight:600}
body.locked{overflow:hidden}

@media(max-width:720px){
  .hero-inner{padding:30px 0 26px}
  .cat-head{flex-wrap:wrap;padding:17px 16px;gap:12px}
  .cat-body{padding:2px 16px 20px}
  .owner-badge{order:4}
  .cat-prog{order:5}
  .task{flex-wrap:wrap}
  .task-controls{flex-direction:row;width:100%;justify-content:flex-start;padding-left:35px}
  .fact{flex-direction:column;gap:3px}
  .fact .k{flex:none}
  .dl-row{flex-direction:column;gap:2px}
  .dl-when{flex:none}
  .tl-item{flex:1 0 132px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="locked">

<div id="gate">
  <div class="box">
    <div class="glogo">RetroStyle Games · HR</div>
    <h2>Треки міні Олі</h2>
    <p>Внутрішня сторінка. Введіть пароль доступу.</p>
    <input id="gatePass" type="password" placeholder="Пароль" autocomplete="off">
    <button id="gateBtn">Увійти</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div id="app"></div>

<script>
/* ============================================================
   ВМІСТ СТОРІНКИ ЗАШИФРОВАНИЙ (AES-256-GCM, ключ із пароля).
   У цьому файлі немає ні пароля, ні тексту сторінки — тільки шифротекст.

function b64(s){ var raw=atob(s), a=new Uint8Array(raw.length); for(var i=0;i<raw.length;i++) a[i]=raw.charCodeAt(i); return a; }

async function decryptWith(pass){
  var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return new TextDecoder().decode(pt);
}

(function(){
  var gate=document.getElementById('gate'), inp=document.getElementById('gatePass'),
      btn=document.getElementById('gateBtn'), err=document.getElementById('gateErr');

  async function tryPass(pass, silent){
    var html;
    btn.disabled=true; if(!silent) err.textContent='Розшифровую…';
    try{ html = await decryptWith(pass); }
    catch(e){ btn.disabled=false; err.textContent = silent ? '' : 'Невірний пароль'; return false; }
    try{ sessionStorage.setItem('olha-handoff-pass', pass); }catch(e){}
    document.getElementById('app').innerHTML = html;
    gate.style.display='none'; document.body.classList.remove('locked');
    await boot();
    return true;
  }

  btn.addEventListener('click', function(){ tryPass(inp.value.trim(), false); });
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') tryPass(inp.value.trim(), false); });

  var saved=null; try{ saved=sessionStorage.getItem('olha-handoff-pass'); }catch(e){}
  if(saved) tryPass(saved, true).then(function(ok){ if(!ok) inp.focus(); });
  else setTimeout(function(){ inp.focus(); },120);
})();

/* ================= STORE ================= */
/* Порожньо = сторінка працює локально в браузері кожного.
   Щоб галочки бачили всі — сюди вставляється URL спільного сховища (Apps Script Web App). */
var BACKEND_URL = "";
var LS_KEY = "olha-handoff-v1";
var state = {}, dirty = {};

function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch(e){ return {}; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function setSync(mode,msg){
  var dot=document.getElementById('syncDot'), m=document.getElementById('syncMsg');
  dot.className='sync-dot'+(mode==='ok'?' ok':mode==='local'?' local':'');
  m.textContent=msg;
}
async function remoteLoad(){
  if(!BACKEND_URL) return null;
  try{ var r=await fetch(BACKEND_URL,{method:'GET'}); var j=await r.json(); return (j&&j.state)?j.state:{}; }
  catch(e){ return null; }
}
async function remotePush(patch){
  if(!BACKEND_URL) return false;
  try{ await fetch(BACKEND_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({patch:patch})}); return true; }
  catch(e){ return false; }
}
var pushTimer=null;
function queuePush(id,val){
  dirty[id]=val; state[id]=val; lsSave();
  if(!BACKEND_URL) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(async function(){
    var patch=dirty; dirty={};
    var ok=await remotePush(patch);
    if(ok) setSync('ok','Синхронізовано для всіх · '+timeNow());
    else { setSync('local','Не вдалось зберегти на сервер — збережено локально'); Object.assign(dirty,patch); }
  },700);
}
function timeNow(){ var d=new Date(); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }

/* ================= WIRE ================= */
var OWNERS = ["—","Ніка","Льоша","Ніка + Льоша","Света","Катя","Олена","Паша","міні Оля (сама)"];

function fillOwners(){
  document.querySelectorAll('select.owner').forEach(function(sel){
    var def=sel.getAttribute('data-default')||"—";
    OWNERS.forEach(function(o){
      var opt=document.createElement('option'); opt.value=o; opt.textContent=(o==="—"?"— хто взяв":o); sel.appendChild(opt);
    });
    sel.value = OWNERS.indexOf(def)>=0 ? def : "—";
  });
}
function applyState(){
  document.querySelectorAll('.task').forEach(function(t){
    var id=t.getAttribute('data-id');
    var chk=t.querySelector('.chk'), dt=t.querySelector('.date'), ow=t.querySelector('.owner');
    var done=state['t.'+id+'.done'], date=state['t.'+id+'.date'], owner=state['t.'+id+'.owner'];
    chk.checked=!!done; t.classList.toggle('done',!!done);
    if(date&&dt) dt.value=date;
    if(owner&&ow) ow.value=owner;
  });
  document.querySelectorAll('.draft').forEach(function(d){
    var v=state['d.'+d.getAttribute('data-id')];
    if(v!=null) d.querySelector('.draft-text').value=v;
  });
  updateProgress();
}
function wire(){
  document.querySelectorAll('.task').forEach(function(t){
    var id=t.getAttribute('data-id');
    var chk=t.querySelector('.chk'), dt=t.querySelector('.date'), ow=t.querySelector('.owner');
    chk.addEventListener('change',function(){
      t.classList.toggle('done',chk.checked);
      queuePush('t.'+id+'.done',chk.checked);
      if(chk.checked&&dt&&!dt.value){
        var d=new Date();
        dt.value=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
        queuePush('t.'+id+'.date',dt.value);
      }
      updateProgress();
    });
    if(dt) dt.addEventListener('change',function(){ queuePush('t.'+id+'.date',dt.value); });
    if(ow) ow.addEventListener('change',function(){ queuePush('t.'+id+'.owner',ow.value); });
  });
  document.querySelectorAll('.draft').forEach(function(d){
    var id=d.getAttribute('data-id'), ta=d.querySelector('.draft-text'), tm=null;
    ta.addEventListener('input',function(){ clearTimeout(tm); tm=setTimeout(function(){ queuePush('d.'+id,ta.value); },500); });
    d.querySelector('.copy-btn').addEventListener('click',function(){
      var b=this;
      navigator.clipboard.writeText(ta.value||"").then(function(){
        b.textContent='Скопійовано ✓'; b.classList.add('copied');
        setTimeout(function(){ b.textContent='Копіювати'; b.classList.remove('copied'); },1500);
      });
    });
  });
  document.querySelectorAll('.copy-inline').forEach(function(b){
    b.addEventListener('click',function(e){
      e.stopPropagation();
      navigator.clipboard.writeText(b.getAttribute('data-copy'));
      var o=b.textContent; b.textContent='скопійовано ✓'; b.classList.add('ok');
      setTimeout(function(){ b.textContent=o; b.classList.remove('ok'); },1400);
    });
  });
  document.querySelectorAll('.cat-head').forEach(function(h){
    h.addEventListener('click',function(){ h.parentElement.classList.toggle('open'); });
  });
  document.getElementById('btnExpand').addEventListener('click',function(){
    var cats=document.querySelectorAll('.cat');
    var anyClosed=Array.prototype.some.call(cats,function(c){ return !c.classList.contains('open'); });
    cats.forEach(function(c){ c.classList.toggle('open',anyClosed); });
    this.textContent = anyClosed ? 'Згорнути все' : 'Розгорнути все';
  });
  document.getElementById('btnOnlyOpen').addEventListener('click',function(){
    document.body.classList.toggle('only-open');
    this.classList.toggle('on',document.body.classList.contains('only-open'));
  });
}
function updateProgress(){
  var all=document.querySelectorAll('.task'), done=0;
  all.forEach(function(t){ if(t.querySelector('.chk').checked) done++; });
  document.getElementById('pdone').textContent=done;
  document.getElementById('ptotal').textContent=all.length;
  document.getElementById('pfill').style.width=(all.length?(done/all.length*100):0)+'%';
  document.querySelectorAll('.cat').forEach(function(c){
    var el=c.querySelector('[data-prog]'); if(!el) return;
    var ts=c.querySelectorAll('.task'); if(!ts.length){ el.textContent=''; return; }
    var d=0; ts.forEach(function(t){ if(t.querySelector('.chk').checked) d++; });
    el.textContent=d+'/'+ts.length;
  });
  document.querySelectorAll('#navbar a').forEach(function(a){
    var c=document.getElementById(a.getAttribute('href').slice(1)); if(!c) return;
    var ts=c.querySelectorAll('.task'), m=a.querySelector('.mini-done'); if(!m) return;
    if(ts.length){ var d=0; ts.forEach(function(t){ if(t.querySelector('.chk').checked) d++; }); m.textContent=d+'/'+ts.length; }
  });
}
function buildNav(){
  var nav=document.getElementById('navbar'), tools=nav.querySelector('.nav-tools');
  document.querySelectorAll('.cat').forEach(function(c){
    var a=document.createElement('a'); a.href='#'+c.id;
    var ts=c.querySelectorAll('.task');
    a.innerHTML=c.getAttribute('data-ico')+' '+c.getAttribute('data-name')+(ts.length?' <span class="mini-done">0/'+ts.length+'</span>':'');
    a.addEventListener('click',function(){ setTimeout(function(){ c.classList.add('open'); },10); });
    nav.insertBefore(a,tools);
  });
}
function scrollSpy(){
  var links=Array.prototype.slice.call(document.querySelectorAll('#navbar a'));
  var obs=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      links.forEach(function(a){ a.classList.toggle('active', a.getAttribute('href')==='#'+e.target.id); });
    });
  },{rootMargin:'-90px 0px -70% 0px'});
  document.querySelectorAll('.cat').forEach(function(c){ obs.observe(c); });
}

/* ================= INIT ================= */
async function boot(){
  fillOwners();
  buildNav();
  state=lsLoad();
  applyState();
  wire();
  scrollSpy();
  if(BACKEND_URL){
    setSync('','Підключення до спільного сховища…');
    var remote=await remoteLoad();
    if(remote){ state=remote; lsSave(); applyState(); setSync('ok','Спільне сховище · синхронізовано'); }
    else setSync('local','Сервер недоступний — працює локально');
    setInterval(async function(){ var r=await remoteLoad(); if(r){ state=r; applyState(); } },20000);
  } else {
    setSync('local','Галочки поки зберігаються тільки у вашому браузері');
  }
  document.querySelector('.cat').classList.add('open');
}
</script>
